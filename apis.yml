aid: basiq

name: Basiq

description: Basiq is an Australian open banking and financial data API platform providing unified access to bank account data and enrichment
  services. It enables fintechs, lenders, and financial service providers to connect to 180+ Australian and New Zealand banks via CDR (Consumer
  Data Right) and third-party connectors. The Basiq API provides user management, bank connections, account balances, transaction history, income
  verification, and expense categorization. Uses JWT Bearer token authentication. Basiq Pty Ltd (ABN 95 616 592 011) is an accredited data recipient
  under the CDR and a wholly-owned but non-guaranteed subsidiary of Cuscal Limited.

