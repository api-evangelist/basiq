openapi: 3.2.0
info:
  title: Affordability Income API
  version: 3.0.0
  license:
    name: commercial
    url: https://basiq.io
servers:
- url: https://au-api.basiq.io
security:
- services_token: []
tags:
- name: Income
paths:
  /users/{userId}/income:
    post:
      tags:
      - Income
      summary: Create an income summary
      description: Create an income summary for a specific user
      operationId: postIncome
      deprecated: true
      parameters:
      - name: userId
        in: path
        description: The identifier of the user.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accounts:
                  type: array
                  description: The list of accounts to be included in the income otherwise all the user accounts will be included in the summary
                  example:
                  - s55bf3
                  - s55bf4
                  items:
                    type: string
                fromMonth:
                  type: string
                  description: The first/start month to be included in the affordability output e.g. "fromMonth":"2019-05". Resulting income resource will be based on data between fromMonth and toMonth
                  example: 2019-05
                toMonth:
                  type: string
                  description: The first/start month to be included in the affordability output e.g. "fromMonth":"2019-05". Resulting income resource will be based on data between fromMonth and toMonth
                  example: 2019-09
              x-readme-ref-name: IncomePostRequest
        required: false
      responses:
        '200':
          description: Returns a created income resource, if the operation succeeded.
          content:
            application/json:
              schema:
                title: IncomeResponse
                required:
                - fromMonth
                - id
                - summary
                - toMonth
                - type
                type: object
                properties:
                  type:
                    type: string
                    description: Always "income".
                    example: income
                  id:
                    type: string
                    description: The identifier of the income resource to be retrieved.
                    example: s55bf4
                  coverageDays:
                    type: integer
                    description: Number of days covered by the summary
                    format: int64
                    example: 392
                  fromMonth:
                    type: string
                    description: Start month for the period for which the Income summary is generated. The period of time relates to the account and transaction data used as input into the summary.
                    example: 2019-03
                  toMonth:
                    type: string
                    description: End month (usually the current month) for the period for which the Income summary is generated.
                    example: 2020-03
                  regular:
                    type: array
                    description: Required true
                    items:
                      required:
                      - source
                      - ageDays
                      - changeHistory
                      - current
                      - frequency
                      - irregularity
                      - previous3Months
                      type: object
                      properties:
                        source:
                          type: string
                          description: Source regular income (cleaned transaction description).
                          example: payroll wfrms 15439393
                        ageDays:
                          type: integer
                          description: Duration regular income (number days from first to last occurrence) returned as an integer with values zero or greater
                          format: int64
                          example: 334
                        changeHistory:
                          type: array
                          description: Each amount classified as income (repeated for each income credit and ordered by most recent)
                          items:
                            required:
                            - amount
                            - date
                            - source
                            type: object
                            properties:
                              amount:
                                type: string
                                description: Amount of income for that period
                                example: '62.00'
                              date:
                                type: string
                                description: Date income received
                                example: '2018-10-13T20:03:37'
                              source:
                                type: string
                                description: Source income (cleaned transaction description)
                                example: savings interest cr bal - Account 1
                            x-readme-ref-name: ChangeHistoryIncome
                        current:
                          required:
                          - amount
                          - date
                          - nextDate
                          type: object
                          properties:
                            amount:
                              type: string
                              description: Most recent regular income payment amount
                              example: '18098.00'
                            date:
                              type: string
                              description: Most recent regular income payment date
                              example: '2018-11-30T09:23:37'
                            nextDate:
                              type:
                              - string
                              - 'null'
                              description: 'Predicted next occurrence for regular income (note: where the pattern has recently ceased there would be no predicted next occurrence)'
                              example: '2018-12-30T18:30:49'
                          x-readme-ref-name: CurrentRegularSource
                        frequency:
                          type: string
                          description: Enum detailing frequency regular income
                          example: monthly
                          enum:
                          - daily
                          - weekly
                          - bi-weekly
                          - monthly
                          - bi-monthly
                          - quarterly
                          - half-year
                          - yearly
                        irregularity:
                          required:
                          - gaps
                          - stability
                          type: object
                          properties:
                            gaps:
                              type: array
                              description: Array of dates for which the expected credit is not met
                              example:
                              - 2020-03
                              items:
                                type: string
                                x-readme-ref-name: Gap
                            stability:
                              type: string
                              description: Stability percentage indicator of how stable the income is. 100 = no gaps in the income series from the source. Calculated as (number of transactions that are included in the income summary for this source) / (number of transactions that were expected to be included in the income summary for this source).
                              example: '100.00'
                          x-readme-ref-name: IrregularityIncome
                        previous3Months:
                          required:
                          - amountAvg
                          - amountAvgMonthly
                          - variance
                          type: object
                          properties:
                            amountAvg:
                              type: string
                              description: 'Median regular income amount - calculated across all occurrences in last 3 months (note: median provides a more reliable amount than mean for a regular income source as it is less affected by outliers and skewed data - use variance amount to understand outliers and changeHistory to view actual credits)'
                              example: '18098.00'
                            amountAvgMonthly:
                              type: string
                              description: Median monthly regular income amount
                              example: '18098.00'
                            variance:
                              type: string
                              description: Difference between min and max payment amount for regular income
                              example: '0.00'
                          x-readme-ref-name: Previous3MonthsIncome
                      description: 'RegularSource

                        Our complex income algorithm uses over 50 rules to identify different types of income sources. For example, to identify a regular income source - the fortnightly salary should have a minimum of 5 credits across a 90 day time period with regular intervals. Additionally, tolerances are applied based on confidence in identified income source patterns (by amount and frequency).'
                      x-readme-ref-name: RegularSource
                  irregular:
                    type: array
                    description: Required true
                    items:
                      required:
                      - ageDays
                      - amountAvg
                      - avgMonthlyOccurence
                      - changeHistory
                      - current
                      - frequency
                      - noOccurrences
                      - source
                      type: object
                      properties:
                        ageDays:
                          type: integer
                          description: Duration irregular income (number days from first to last occurrence) returned as an integer with values zero or greater.
                          format: int64
                          example: 334
                        amountAvg:
                          type: string
                          description: Mean of irregular income amount - calculated across all occurrences identified.
                          example: '55.00'
                        avgMonthlyOccurence:
                          type: string
                          description: Average (mean) number of times per calendar month the credits in the series occur.
                          example: '1'
                        changeHistory:
                          type: array
                          description: Each amount classified as income (repeated for each income credit and ordered by most recent)
                          items:
                            required:
                            - amount
                            - date
                            - source
                            type: object
                            properties:
                              amount:
                                type: string
                                description: Amount of income for that period
                                example: '62.00'
                              date:
                                type: string
                                description: Date income received
                                example: '2018-10-13T20:03:37'
                              source:
                                type: string
                                description: Source income (cleaned transaction description)
                                example: savings interest cr bal - Account 1
                            x-readme-ref-name: ChangeHistoryIncome
                        current:
                          required:
                          - amount
                          - date
                          type: object
                          properties:
                            amount:
                              type: string
                              description: Most recent irregular income payment amount
                              example: '62.00'
                            date:
                              type: string
                              description: Most recent irregular income payment date
                              example: '2018-10-13T20:03:37'
                          x-readme-ref-name: CurrentIrregularSource
                        frequency:
                          type: string
                          description: Frequency is "irregular"
                          example: irregular
                        noOccurrences:
                          type: integer
                          description: Number of instances of credits in the series.
                          format: int64
                          example: 5
                        source:
                          type: string
                          description: Source irregular income (cleaned transaction description).
                          example: ctrlink carers 998r6789201610974v
                      description: 'IrregularSource

                        Income sources typically require at least 5 credits across a minimum 90 day time period'
                      x-readme-ref-name: IrregularSource
                  otherCredit:
                    type: array
                    description: Required true
                    items:
                      required:
                      - ageDays
                      - amountAvg
                      - avgMonthlyOccurence
                      - changeHistory
                      - current
                      - frequency
                      - noOccurrences
                      - source
                      type: object
                      properties:
                        ageDays:
                          type: integer
                          description: Duration other income (number days from first to last occurrence) returned as an integer with values zero or greater.
                          format: int64
                          example: 335
                        amountAvg:
                          type: string
                          description: Mean of irregular income amount - calculated across all occurrences identified.
                          example: '110.85'
                        avgMonthlyOccurence:
                          type: string
                          description: Average (mean) number of times per calendar month the credits in the series occur.
                          example: '1'
                        changeHistory:
                          type: array
                          description: Each amount classified as income (repeated for each income credit and ordered by most recent)
                          items:
                            required:
                            - amount
                            - date
                            - source
                            type: object
                            properties:
                              amount:
                                type: string
                                description: Amount of income for that period
                                example: '62.00'
                              date:
                                type: string
                                description: Date income received
                                example: '2018-10-13T20:03:37'
                              source:
                                type: string
                                description: Source income (cleaned transaction description)
                                example: savings interest cr bal - Account 1
                            x-readme-ref-name: ChangeHistoryIncome
                        current:
                          required:
                          - amount
                          - date
                          - otherCreditLabel
                          type: object
                          properties:
                            amount:
                              type: string
                              description: Most recent irregular income payment amount
                              example: '92.99'
                            date:
                              type: string
                              description: Most recent irregular income payment date
                              example: '2019-10-29T00:00:00'
                            otherCreditLabel:
                              type: string
                              description: Description of the other credit series e.g. 'former regular income'
                              example: regular income small amount
                          x-readme-ref-name: CurrentOtherCreditSource
                        frequency:
                          type: string
                          description: Frequency is "other", "irregular" or a time period e.g. "bi-weekly"
                          example: monthly
                          enum:
                          - daily
                          - weekly
                          - bi-weekly
                          - monthly
                          - bi-monthly
                          - quarterly
                          - half-year
                          - yearly
                          - other
                          - irregular
                        noOccurrences:
                          type: integer
                          description: Number of instances of credits in the series.
                          format: int64
                          example: 12
                        source:
                          type: string
                          description: Source Other Credit income (cleaned transaction description).
                          example: savings interest cr bal - Account 1
                      description: Other Credit Series are series where a pattern of credit is detected but the pattern does not meet the requirements for regular or irregular income, or the income series is too old e.g. former regular income or a potential future income
                      x-readme-ref-name: OtherCreditSource
                  summary:
                    required:
                    - irregularIncomeAvg
                    - regularIncomeAvg
                    - regularIncomeYTD
                    - regularIncomeYear
                    type: object
                    properties:
                      irregularIncomeAvg:
                        type:
                        - string
                        - 'null'
                        description: Total mean of irregular income monthly calculated across the whole time period for all irregular sources
                        example: '55.00'
                      regularIncomeAvg:
                        type:
                        - string
                        - 'null'
                        description: Total median regular income monthly calculated over the past 3 months for all regular sources
                        example: '18098.00'
                      regularIncomeYTD:
                        type:
                        - string
                        - 'null'
                        description: Total regular income so far this financial year (year to date)
                        example: '90490.00'
                      regularIncomeYear:
                        type:
                        - string
                        - 'null'
                        description: 'Coming soon: total predicted regular income for this financial year'
                        example: null
                    description: Summary totals relating to income analysis
                    x-readme-ref-name: IncomeSummary
                  links:
                    required:
                    - accounts
                    - self
                    type: object
                    properties:
                      accounts:
                        type: array
                        description: Links of accounts
                        example:
                        - https://au-api.basiq.io/users/25c8d1ed77/accounts/s55bf5
                        - https://au-api.basiq.io/users/25c8d1ed77/accounts/s55bf4
                        items:
                          type: string
                      self:
                        type: string
                        description: Link to the requested income resource
                        example: https://au-api.basiq.io/users/25c8d1ed77/income/s55bf4
                    x-readme-ref-name: IncomeLinks
                description: 'Container object, containing income details.


                  The Income Summary object with income summarised and classified by type: regular, irregular or other sources (created/refreshed across up to 10 institutions)'
                x-readme-ref-name: IncomeResponse
        '204':
          description: Returns no content if there are none transactions for the requested period.
          content: {}
        '400':
          description: Returns error that server cannot or will not process the request due to something that is perceived to be a client error.
          content:
            application/json:
              schema:
                required:
                - correlationId
                - data
                - type
                type: object
                properties:
                  type:
                    type: string
                    description: Always "list".
                    example: list
                  correlationId:
                    type: string
                    description: Unique identifier for this particular occurrence of the problem.
                    example: ac5ah5i
                  data:
                    type: array
                    description: Error data.
                    items:
                      required:
                      - code
                      - type
                      type: object
                      properties:
                        code:
                          type: string
                          description: Application-specific error code, expressed as a string value.
                          example: parameter-not-valid
                          enum:
                          - parameter-not-supplied
                          - parameter-not-valid
                          - unsupported-accept
                          - invalid-content
                          - institution-not-supported
                          - invalid-credentials
                        detail:
                          type: string
                          description: Human-readable explanation specific to this occurrence of the problem.
                          example: ID value is not valid.
                        source:
                          title: Source
                          type: object
                          properties:
                            parameter:
                              type: string
                              description: String indicating which URI query parameter caused the error.
                              example: userId
                            pointer:
                              type: string
                              description: Location to the object or attribute that the error relates to.
                              example: users/userId
                          description: An object containing references to the source of the error.
                          x-readme-ref-name: Source
                        title:
                          type: string
                          description: Title of the error
                          example: Parameter not valid.
                        type:
                          type: string
                          description: Type of the response, always "error"
                          example: error
                x-readme-ref-name: BadRequestError
        '403':
          description: Error that access is forbidden and tied to the application logic, such as insufficient rights to a resource.
          content:
            application/json:
              schema:
                required:
                - correlationId
                - data
                - type
                type: object
                properties:
                  correlationId:
                    type: string
                    description: Unique identifier for this particular occurrence of the problem.
                    example: ac5ah5i
                  data:
                    type: array
                    description: Error data.
                    items:
                      required:
                      - code
                      - source
                      - type
                      type: object
                      properties:
                        code:
                          type: string
                          description: Application-specific error code, expressed as a string value.
                          example: forbidden-access
                          enum:
                          - forbidden-access
                          - no-production-access
                          - access-denied
                        detail:
                          type: string
                          description: Human-readable explanation specific to this occurrence of the problem.
                          example: Access to this resource is forbidden.
                        source:
                          title: Source
                          type: object
                          properties:
                            parameter:
                              type: string
                              description: String indicating which URI query parameter caused the error.
                              example: userId
                            pointer:
                              type: string
                              description: Location to the object or attribute that the error relates to.
                              example: users/userId
                          description: An object containing references to the source of the error.
                          x-readme-ref-name: Source
                        title:
                          type: string
                          description: Title of the error
                          example: Forbidden Access
                        type:
                          type: string
                          description: Type of the response, always "error"
                          example: error
                  type:
                    type: string
                    description: Always "list".
                    example: list
                x-readme-ref-name: ForbiddenAccessError
        '404':
          description: Returns error indicating that server can't find requested resource.
          content:
            application/json:
              schema:
                required:
                - correlationId
                - data
                - type
                type: object
                properties:
                  correlationId:
                    type: string
                    description: Unique identifier for this particular occurrence of the problem.
                    example: ac5ah5i
                  data:
                    type: array
                    description: Error data.
                    items:
                      required:
                      - code
                      - type
                      type: object
                      properties:
                        code:
                          type: string
                          description: Application-specific error code, expressed as a string value.
                          example: resource-not-found
                          enum:
                          - resource-not-found
                        detail:
                          type: string
                          description: Human-readable explanation specific to this occurrence of the problem.
                          example: Resource not found.
                        title:
                          type: string
                          description: Title of the error
                          example: Requested resource is not found.
                        type:
                          type: string
                          description: Type of the response, always "error"
                          example: error
                  type:
                    type: string
                    description: Always "list".
                    example: list
                x-readme-ref-name: NotFoundError
        '500':
          description: Returns error response code indicates that the server encountered an unexpected condition that prevented it from fulfilling the request.
          content:
            application/json:
              schema:
                required:
                - correlationId
                - data
                - type
                type: object
                properties:
                  correlationId:
                    type: string
                    description: Unique identifier for this particular occurrence of the problem.
                    example: ac5ah5i
                  data:
                    type: array
                    description: Error data.
                    items:
                      required:
                      - code
                      - type
                      type: object
                      properties:
                        code:
                          type: string
                          description: Application-specific error code, expressed as a string value.
                          example: internal-server-error
                          enum:
                          - internal-server-error
                        detail:
                          type: string
                          description: Human-readable explanation specific to this occurrence of the problem.
                          example: Internal Server error. Contact support.
                        title:
                          type: string
                          description: Title of the error
                          example: Internal Server error.
                        type:
                          type: string
                          description: Type of the response, always "error"
                          example: error
                  type:
                    type: string
                    description: Always "list".
                    example: list
                x-readme-ref-name: InternalServerError
      security:
      - services_token: []
