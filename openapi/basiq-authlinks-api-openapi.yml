openapi: 3.2.0
info:
  title: Platform Auth Links API
  description: All included utility endpoints for Basiq partners
  version: 3.0.0
  termsOfService: https://docs.basiq.io/en/collections/440849-privacy-terms-and-common-questions
  license:
    name: Commercial
    url: https://basiq.io
servers:
- url: https://au-api.basiq.io
security:
- api_key: []
- services_token: []
tags:
- name: AuthLinks
paths:
  /users/{userId}/auth_link:
    post:
      tags:
      - AuthLinks
      summary: Create an auth_link
      description: 'Create a new auth_link object by making a POST request to the auth_link endpoint. The new auth_link will effectively delete previous auth_link for that user, rendering the previous URL(s) invalid.


        The ''mobile'' attribute is used for 2FA SMS verification and is conditionally required. If it is not specified, we will look up the mobile on the user object; if that is not specified either, you will get an error. If both are specified, the mobile number on the auth_link will take precedence.'
      operationId: postAuthLink
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mobile:
                  type: string
        required: false
      responses:
        '201':
          description: Returns a created auth_link resource, if the operation succeeded
          content:
            application/json:
              schema:
                required:
                - mobile
                - type
                - userId
                - expiresAt
                type: object
                properties:
                  mobile:
                    type: string
                    description: A user's mobile phone, used as for authentication.
                    example: 61410000000
                  type:
                    type: string
                    description: Type of the response, always "auth_link".
                    example: auth_link
                  userId:
                    type: string
                    description: A string that uniquely identifies the user.
                    example: ec4ea48d
                  expiresAt:
                    type: string
                    description: The date time of auth link expiry.
                    example: '2019-11-21T04:08:50Z'
                  links:
                    required:
                    - public
                    - self
                    type: object
                    properties:
                      public:
                        type: string
                        description: Public URL of auth link.
                        example: https://connect.basiq.io/63448be4
                      self:
                        type: string
                        description: URL of the resource
                        example: /users/ec4ea48d/auth_link
                    x-readme-ref-name: AuthLinkLinks
                x-readme-ref-name: AuthLinksPostResponseResource
        '400':
          description: Returns error that server cannot or will not process the request due to something that is perceived to be a client error
          content:
            application/json:
              schema:
                required:
                - correlationId
                - data
                - type
                type: object
                properties:
                  type:
                    type: string
                    description: Always "list".
                    example: list
                  correlationId:
                    type: string
                    description: Unique identifier for this particular occurrence of the problem.
                    example: ac5ah5i
                  data:
                    type: array
                    description: Error data.
                    items:
                      required:
                      - code
                      - type
                      type: object
                      properties:
                        type:
                          type: string
                          description: Type of the response, always "error"
                          example: error
                        title:
                          type: string
                          description: Title of the error
                          example: Parameter not valid.
                        code:
