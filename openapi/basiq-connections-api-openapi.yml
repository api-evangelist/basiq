openapi: 3.2.0
info:
  title: Connections API
  description: All included utility endpoints for Basiq partners
  version: 3.0.0
  termsOfService: https://docs.basiq.io/en/collections/440849-privacy-terms-and-common-questions
  license:
    name: Commercial
    url: https://basiq.io
servers:
- url: https://au-api.basiq.io
security:
- api_key: []
- services_token: []
tags:
- name: Connections
paths:
  /users/{userId}/connections:
    get:
      tags:
      - Connections
      summary: List all connections
      description: Returns a list of connections belonging to this user. Each entry in the array is a separate object. If no data is returned, the resulting array will be empty.
      operationId: getConnections
      parameters:
      - name: userId
        in: path
        description: User identifier.
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: Connections filters, id, status, institution.id. e.g institution.id.eq('AU00000')
        schema:
          type: string
      responses:
        '200':
          description: Returns details of connections.
          content:
            application/json:
              schema:
                title: ConnectionsGetResponseResource
                required:
                - type
                type: object
                properties:
                  type:
                    type: string
                    description: Type, always "list".
                    example: list
                  data:
                    type: array
                    items:
                      required:
                      - createdDate
                      - expiryDate
                      - id
                      - method
                      - institution
                      - links
                      - type
                      type: object
                      properties:
                        type:
                          type: string
                          description: Type, always "connection".
                          example: connection
                        id:
                          type: string
                          description: Connection identification.
                          example: '61723'
                        method:
                          type: string
                          description: method identification.
                          example: openbanking
                        status:
                          type: string
                          description: Connection status, available only for SERVER_SCOPE.
                          example: active
                          enum:
                          - active
                          - pending
                          - invalid
                          - pre-init
                        createdDate:
                          type: string
                          description: Created date of the connection, available only for SERVER_SCOPE.
                          example: '2019-07-29T07:34:09Z'
                        expiryDate:
                          type: string
                          description: "Expiry date of the connection.This date is only set for open-banking connections. \n\nFor web connections, the expiry date field will be empty.\n"
                          example: '2020-07-29T07:34:09Z'
                        lastUsed:
                          type: string
                          description: Connection last used date, available only for SERVER_SCOPE.
                          example: '2020-06-22T11:15:09Z'
                        institution:
                          title: ConnectionInstitution
                          required:
                          - id
                          - links
                          - type
                          type: object
                          properties:
                            id:
                              type: string
                              description: Institution id
                              example: AU00000
                            links:
                              title: ResourceLink
                              required:
                              - self
                              type: object
                              properties:
                                self:
                                  type: string
                                  description: URL of the resource.
                                  example: https://au-api.basiq.io/users/cd6fbd92/accounts/319ae910
                              description: Link object containing a link to the resource, self reference.
                              x-readme-ref-name: ResourceLink
                            type:
                              type: string
                              description: Always "institution".
                              example: institution
                          description: Institution details.
                          x-readme-ref-name: ConnectionInstitution
                        links:
                          title: GetConnectionsLinks
                          required:
                          - institution
                          - self
                          type: object
                          properties:
                            accounts:
                              type: string
                              description: Accounts reference url.
                              example: https://au-api.basiq.io/users/cd6fbd92/accounts?filter=institution.id.eq('AU00000')
                            institution:
                              type: string
                              description: Institution details.
                              example: https://au-api.basiq.io/institutions/AU00000
                            self:
                              type: string
                              description: Connection self reference url.
                              example: https://au-api.basiq.io/users/cd6fbd92/connections/29523951
                            transactions:
                              type: string
                              description: Transactions reference url.
                              example: https://au-api.basiq.io/users/cd6fbd92/transactions?filter=institution.id.eq('AU00000')
                          description: Object containing links to resources.
                          x-readme-ref-name: GetConnectionsLinks
                      x-readme-ref-name: ConnectionsData
                  links:
                    title: ResourceLink
                    required:
                    - self
                    type: object
                    properties:
                      self:
                        type: string
                        description: URL of the resource.
                        example: https://au-api.basiq.io/users/cd6fbd92/accounts/319ae910
                    description: Link object containing a link to the resource, self reference.
                    x-readme-ref-name: ResourceLink
                description: Object containing details for connections.
                x-readme-ref-name: ConnectionsGetResponseResource
