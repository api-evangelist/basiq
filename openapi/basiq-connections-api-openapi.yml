  /users/{userId}/connections/{connectionId}:
    get:
      tags:
      - Connections
      summary: Retrieve a connection
      description: Use this to retrieve details of a specific connection. Note that due to security the loginId, password, securityCode are never returned.
      operationId: getConnection
      parameters:
      - name: userId
        in: path
        description: The identifier of the user.
        required: true
        schema:
          type: string
      - name: connectionId
        in: path
        description: The identifier of the connection.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns details of a connection.
          content:
            application/json:
              schema:
                title: ConnectionGetResponseResource
                required:
                - createdDate
                - expiryDate
                - method
                - id
                - institution
                - links
                - type
                type: object
                properties:
                  type:
                    type: string
                    description: Type, always "connection".
                    example: connection
                  id:
                    type: string
                    description: A string that uniquely identifies the user connection.
                    example: '61723'
                  method:
                    type: string
                    description: A string that uniquely identifies the user connections either it is web or openbanking
                    example: open-banking
                  createdDate:
                    type: string
                    description: Created date of the connection, available only for SERVER_SCOPE.
                    example: '2019-07-29T07:34:09Z'
                  expiryDate:
                    type: string
                    description: "Expiry date of the connection.This date is only set for open-banking connections. \n\nFor web connections, the expiry date field will be empty.\n"
                    example: '2020-07-29T07:34:09Z'
                  lastUsed:
                    type: string
                    description: UTC Date and Time of when the connection was last used, in RFC 3339 format, available only for SERVER_SCOPE.
                    example: '2020-06-22T11:15:09Z'
                  accounts:
                    required:
                    - data
                    - type
                    type: object
                    properties:
                      type:
                        type: string
                        description: Type always "list".
                        example: list
                      data:
                        type: array
                        description: Accounts details
                        items:
                          required:
                          - type
                          - id
                          - lastUpdated
                          - accountNo
                          - availableFunds
                          - balance
                          - class
                          - currency
                          - links
                          - name
                          - status
                          type: object
                          properties:
                            type:
                              type: string
                              description: Type always "account".
                              example: account
                            id:
                              type: string
                              description: Account identification.
                              example: 319ae910
                            name:
                              type: string
                              description: Account name.
                              example: Business account
                            currency:
                              type: string
                              description: Currency
                              example: AUD
                            class:
                              required:
                              - type
                              - product
                              properties:
                                type:
                                  type: string
                                  description: Account type
                                  example: mortgage
                                product:
                                  type: string
                                  description: Product name.
                                  example: Hooli Home Loan
                              x-readme-ref-name: AccountClass
                            accountNo:
                              type: string
                              description: Account number
                              example: '105148119695'
                            availableFunds:
                              type:
                              - string
                              - 'null'
                              description: Account available funds, nullable.
                              example: '200.54'
                            balance:
                              type:
                              - string
                              - 'null'
                              description: Account balance, nullable.
                              example: '100.12'
                            lastUpdated:
                              type: string
                              description: Account last updated date and time.
                              example: '2017-09-28T11:15:09.756Z'
                            status:
                              type: string
                              description: Account status.
                              example: available
                              enum:
                              - available
                              - unavailable
                            links:
                              required:
                              - self
                              - transactions
                              type: object
                              properties:
                                transactions:
                                  type: string
                                  description: transactions link to the transactions associated with this account
                                  example: https://au-api.basiq.io/users/ea3a81/transactions?filter=account.id.eq('s55bf3')
                                self:
                                  type: string
                                  description: self link to the requested account
                                  example: https://au-api.basiq.io/users/cd6fbd92/accounts/319ae910
                              x-readme-ref-name: ConnectionAccountLinks
                          x-readme-ref-name: AccountsData
                    x-readme-ref-name: AccountsContainer
                  institution:
                    title: ConnectionInstitution
                    required:
                    - id
                    - links
                    - type
                    type: object
                    properties:
                      id:
                        type: string
                        description: Institution id
                        example: AU00000
                      links:
                        title: ResourceLink
                        required:
                        - self
                        type: object
                        properties:
                          self:
                            type: string
                            description: URL of the resource.
                            example: https://au-api.basiq.io/users/cd6fbd92/accounts/319ae910
                        description: Link object containing a link to the resource, self reference.
                        x-readme-ref-name: ResourceLink
                      type:
                        type: string
                        description: Always "institution".
                        example: institution
                    description: Institution details.
                    x-readme-ref-name: ConnectionInstitution
                  profile:
                    required:
                    - emailAddresses
                    - firstName
                    - fullName
                    - lastName
                    - middleName
                    - phoneNumbers
                    - physicalAddresses
                    type: object
                    properties:
                      emailAddresses:
                        type: array
                        description: User email address
                        example:
                        - gavin@hooli.com
                        items:
                          type: string
                      firstName:
                        type: string
                        description: User first name
                        example: Gavin
                      fullName:
                        type: string
                        description: User full name
                        example: Gavin Belson
                      lastName:
                        type: string
                        description: User last name
                        example: Belson
