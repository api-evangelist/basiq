openapi: 3.2.0
info:
  title: Connect Consents API
  description: All included utility endpoints for Basiq partners
  version: 3.0.0
  termsOfService: https://docs.basiq.io/en/collections/440849-privacy-terms-and-common-questions
  license:
    name: Commercial
    url: https://basiq.io
servers:
- url: https://au-api.basiq.io
security:
- api_key: []
- services_token: []
tags:
- name: Consents
paths:
  /users/{userId}/consents:
    get:
      tags:
      - Consents
      summary: Retrieve consents
      description: Retrieves a list of the user consents
      operationId: getConsents
      parameters:
      - name: userId
        in: path
        description: The identifier of the user
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns a list of user consents if they exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: list
                  size:
                    type: integer
                    example: 2
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        type:
                          type: string
                        id:
                          type: string
                          format: uuid
                        created:
                          type: string
                          format: date-time
                        updated:
                          type: string
                          format: date-time
                        expiryDate:
                          type: string
                          format: date-time
                        origin:
                          type: string
                        status:
                          type: string
                          description: active, revoked, and expired
                        purpose:
                          type: object
                          additionalProperties: false
                          properties:
                            primary:
                              type: object
                              additionalProperties: false
                              properties:
                                title:
                                  type: string
                                description:
                                  type: string
                              required:
                              - description
                              - title
                              title: Primary
                              x-readme-ref-name: Primary
