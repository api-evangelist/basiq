                                type: object
                                additionalProperties: false
                                properties:
                                  scope:
                                    type: string
                                  required:
                                    type: boolean
                                  consented:
                                    type: boolean
                                  entity:
                                    type: string
                                  information:
                                    type: object
                                    additionalProperties: false
                                    properties:
                                      name:
                                        type: string
                                      description:
                                        type: string
                                      attributeList:
                                        type: array
                                        items:
