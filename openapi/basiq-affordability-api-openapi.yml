                    example: s55bf3
                  coverageDays:
                    type: integer
                    description: Number of days covered by the summary
                    format: int64
                    example: 392
                  assets:
                    type: array
                    description: Assets
                    items:
                      required:
                      - account
                      - availableFunds
                      - balance
                      - currency
                      - institution
                      - previous6Months
                      - type
