openapi: 3.2.0
info:
  title: Connect Jobs API
  description: All included utility endpoints for Basiq partners
  version: 3.0.0
  termsOfService: https://docs.basiq.io/en/collections/440849-privacy-terms-and-common-questions
  license:
    name: Commercial
    url: https://basiq.io
servers:
- url: https://au-api.basiq.io
security:
- api_key: []
- services_token: []
tags:
- name: Jobs
paths:
  /users/{userId}/jobs:
    get:
      tags:
      - Jobs
      summary: Get user jobs
      description: 'Retrieves the details of all existing and previous jobs associated with a user.


        **Note:** This endpoint only returns jobs that are less than 7 days old.'
      operationId: getUserJobs
      parameters:
      - name: userId
        in: path
        description: User identifier
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: Connection identification filter. e.g. connection.id.eq('ab63cd')
        schema:
          type: string
      responses:
        '200':
          description: Returns a list of jobs with details.
          content:
            application/json:
              schema:
                required:
                - data
                - links
                - size
                - type
                type: object
                properties:
                  type:
                    type: string
                    description: Type of the response, always "list".
                    example: list
                  data:
                    type: array
                    description: Container object, containing job details.
                    items:
                      title: JobsData
                      required:
                      - created
                      - id
                      - institution
                      - steps
                      - updated
                      type: object
                      properties:
                        type:
                          type: string
                          description: Value is "job".
                          example: job
                        id:
                          type: string
                          description: A string that uniquely identifies the job.
                          example: e9132638
                        created:
                          type: string
                          description: The date time when the job was created.
                          example: '2020-06-10T09:59:00Z'
                        updated:
                          type: string
                          description: The date time when the job was last updated.
                          example: '2020-06-10T09:59:00Z'
                        institution:
                          title: Institution
                          required:
                          - id
                          - links
                          - type
                          type: object
                          properties:
                            id:
                              type: string
                              description: A string that uniquely identifies institution.
                              example: AU00000
                            links:
                              title: JobsLinks
                              required:
                              - self
                              type: object
                              properties:
                                self:
                                  type: string
                                  description: URL of the resource
                                  example: https://au-api.basiq.io/jobs/61723
                                source:
                                  type: string
                                  description: Resource that initiated creation of this Job. For example, for operations on Connection, this is a Connection URL. This is only returned for Connection jobs and not for Statement jobs.
                                  example: https://au-api.basiq.io/users/ea3a81/connections/8fce3b
                              description: Links to the resources.
                              x-readme-ref-name: JobsLinks
                            type:
                              type: string
                              description: Always "institution".
                              example: institution
                          description: Institution details.
                          x-readme-ref-name: JobsInstitution
                        steps:
                          type: array
                          description: List of steps that need to be completed.
                          items:
                            title: JobsStep
                            required:
                            - result
                            - status
                            type: object
                            properties:
                              title:
                                type: string
                                description: Name of the step the job needs to complete.
                                example: retrieve-accounts
                                enum:
                                - verify-credentials
                                - retrieve-accounts
                                - retrieve-transactions
                                - retrieve-statements
                              status:
                                type: string
                                description: Status of the job step
                                example: success
                                enum:
                                - pending
                                - in-progress
                                - success
                                - failed
                              result:
                                title: JobsResult
                                type: object
                                properties:
                                  code:
                                    type: string
                                    description: In case of failed job, displays error code.
                                    enum:
                                    - success
                                    - user-action-required
                                    - system-unavailable
                                    - maintenance
                                    - connector-error
                                    - institution-not-found
                                    - institution-not-available
                                    - institution-disabled
                                    - missing-required-field
                                    - missing-required-field-value
                                    - invalid-field-value
                                    - invalid-csv-row
                                    - row-count-exceeded
                                    - account-data-differs
                                    - empty-file
                                    - bank-statement-invalid
                                    - bank-statement-new-product
                                    - bank-statement-parsing-error
                                    - bank-statement-not-supported
                                    - txn-after-last-updated-date
                                    - invalid-connection
                                    - unknown-error
                                    - job-timed-out
                                  details:
                                    type: string
                                    description: In case of failed job, displays details of the error.
                                  title:
                                    type: string
                                    description: In case of failed job, displays error title.
                                  type:
                                    type: string
                                    description: In case of success, Always "link".
                                    example: link
                                  url:
                                    type: string
                                    description: In case of success, URL of the updated (or created) resources.
                                description: Result object containing a list of URLs or null. Otherwise if a step failed contains an error response.
                                x-readme-ref-name: JobsResult
                            description: List of steps that need to be completed.
                            x-readme-ref-name: JobsStep
                        links:
                          title: JobsLinks
                          required:
                          - self
                          type: object
                          properties:
                            self:
                              type: string
                              description: URL of the resource
                              example: https://au-api.basiq.io/jobs/61723
                            source:
                              type: string
                              description: Resource that initiated creation of this Job. For example, for operations on Connection, this is a Connection URL. This is only returned for Connection jobs and not for Statement jobs.
                              example: https://au-api.basiq.io/users/ea3a81/connections/8fce3b
                          description: Links to the resources.
                          x-readme-ref-name: JobsLinks
                      description: Container object, containing job details.
                      x-readme-ref-name: JobsData
                  size:
                    type: integer
                    description: Size of the all the jobs.
                    format: int64
                    example: 100
                  links:
                    title: ResourceLink
                    required:
                    - self
                    type: object
                    properties:
                      self:
                        type: string
                        description: URL of the resource.
                        example: https://au-api.basiq.io/link/a3dgf4567a89
                    description: Link object containing a link to the resource, self reference.
                    x-readme-ref-name: ResourceLink
                x-readme-ref-name: JobsResponseResource
        '400':
          description: Returns error that server cannot or will not process the request due to something that is perceived to be a client error
          content:
            application/json:
              schema:
                required:
                - correlationId
                - data
                - type
                type: object
                properties:
                  type:
                    type: string
                    description: Always "list".
                    example: list
                  correlationId:
                    type: string
                    description: Unique identifier for this particular occurrence of the problem.
                    example: ac5ah5i
                  data:
                    type: array
                    description: Error data.
                    items:
                      required:
                      - code
                      - type
                      type: object
                      properties:
                        type:
                          type: string
                          description: Type of the response, always "error"
                          example: error
                        title:
                          type: string
                          description: Title of the error
                          example: Parameter not valid.
                        code:
                          type: string
                          description: Application-specific error code, expressed as a string value.
                          example: parameter-not-valid
                          enum:
                          - parameter-not-supplied
                          - parameter-not-valid
                          - unsupported-accept
                          - invalid-content
                          - institution-not-supported
                          - invalid-credentials
                        detail:
                          type: string
                          description: Human-readable explanation specific to this occurrence of the problem.
                          example: ID value is not valid.
                        source:
                          title: Source
                          type: object
                          properties:
                            parameter:
                              type: string
                              description: String indicating which URI query parameter caused the error.
                              example: id
                          description: An object containing references to the source of the error.
                          x-readme-ref-name: Source
                x-readme-ref-name: BadRequestError
        '401':
          description: Error status response code indicates that the request has not been applied because it lacks valid authentication credentials for the target resource.
          content:
            application/json:
              schema:
                required:
                - correlationId
                - data
                - type
                type: object
                properties:
                  correlationId:
                    type: string
                    description: Unique identifier for this particular occurrence of the problem.
                    example: ac5ah5i
                  data:
                    type: array
                    description: Error data.
                    items:
                      required:
                      - code
                      - type
                      type: object
                      properties:
                        code:
                          type: string
                          description: Application-specific error code, expressed as a string value.
                          example: unauthorized-access
                          enum:
                          - unauthorized-access
                          - invalid-authorization-token
                        detail:
                          type: string
                          description: Human-readable explanation specific to this occurrence of the problem.
                          example: You are not authorized to access this resource
                        title:
                          type: string
                          description: Title of the error
                          example: Unauthorized Access
                        type:
                          type: string
                          description: Type of the response, always "error"
                          example: error
                  type:
                    type: string
                    description: Always "list".
                    example: list
                x-readme-ref-name: UnauthorizedError
        '403':
          description: Error that access is forbidden and tied to the application logic, such as insufficient rights to a resource.
          content:
            application/json:
              schema:
                required:
                - correlationId
                - data
                - type
                type: object
                properties:
                  type:
                    type: string
                    description: Always "list".
                    example: list
                  correlationId:
                    type: string
                    description: Unique identifier for this particular occurrence of the problem.
                    example: ac5ah5i
                  data:
                    type: array
                    description: Error data.
                    items:
                      required:
                      - code
                      - source
                      - type
                      type: object
                      properties:
                        type:
                          type: string
                          description: Type of the response, always "error"
                          example: error
                        title:
                          type: string
                          description: Title of the error
                          example: Forbidden Access
                        code:
                          type: string
                          description: Application-specific error code, expressed as a string value.
                          example: forbidden-access
                          enum:
                          - forbidden-access
                          - no-production-access
                          - access-denied
                        detail:
                          type: string
                          description: Human-readable explanation specific to this occurrence of the problem.
                          example: Access to this resource is forbidden.
                        source:
                          title: Source
                          type: object
                          properties:
                            parameter:
                              type: string
                              description: String indicating which URI query parameter caused the error.
                              example: id
                          description: An object containing references to the source of the error.
                          x-readme-ref-name: Source
                x-readme-ref-name: ForbiddenAccessError
        '404':
          description: Returns error indicating that server can't find requested resource.
          content:
            application/json:
              schema:
                required:
                - correlationId
                - data
                - type
                type: object
                properties:
                  type:
                    type: string
                    description: Always "list".
                    example: list
                  correlationId:
                    type: string
                    description: Unique identifier for this particular occurrence of the problem.
                    example: ac5ah5i
                  data:
                    type: array
                    description: Error data.
                    items:
                      required:
                      - code
                      - type
                      type: object
                      properties:
                        code:
                          type: string
                          description: Application-specific error code, expressed as a string value.
                          example: resource-not-found
                          enum:
                          - resource-not-found
                        detail:
                          type: string
                          description: Human-readable explanation specific to this occurrence of the problem.
                          example: Resource not found.
                        title:
                          type: string
                          description: Title of the error
                          example: Requested resource is not found.
                        type:
                          type: string
                          description: Type of the response, always "error"
                          example: error
                x-readme-ref-name: NotFoundError
        '500':
          description: Returns error response code indicates that the server encountered an unexpected condition that prevented it from fulfilling the request.
          content:
            application/json:
              schema:
                required:
                - correlationId
                - data
                - type
                type: object
                properties:
                  type:
                    type: string
                    description: Always "list".
                    example: list
                  correlationId:
                    type: string
                    description: Unique identifier for this particular occurrence of the problem.
                    example: ac5ah5i
                  data:
                    type: array
                    description: Error data.
                    items:
                      required:
                      - code
                      - type
                      type: object
                      properties:
                        code:
                          type: string
                          description: Application-specific error code, expressed as a string value.
                          example: internal-server-error
                          enum:
                          - internal-server-error
                        detail:
                          type: string
                          description: Human-readable explanation specific to this occurrence of the problem.
                          example: Internal Server error. Contact support.
                        title:
                          type: string
                          description: Title of the error
                          example: Internal Server error.
                        type:
                          type: string
                          description: Type of the response, always "error"
                          example: error
                x-readme-ref-name: InternalServerError
      security:
      - services_token: []
  /jobs/{jobId}:
    get:
      tags:
      - Jobs
      summary: Retrieve a job
      description: Retrieves the details of an existing job. You need only supply the unique job identifier that was returned upon job creation.
      operationId: getJobs
      parameters:
      - name: jobId
        in: path
        description: The identifier of the job to be retrieved.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns a job details if a valid job ID was provided.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    type:
                      type: string
                    id:
                      type: string
                    partnerId:
                      type: string
                    status:
                      type: string
                    jobType:
                      type: string
                    applicationId:
                      type: string
                    created:
                      description: date and time in ISO format of when the job request was created
                      type: string
                      format: date-time
                    updated:
                      description: date and time in ISO format of when the job request was updated
                      type: string
                      format: date-time
                    steps:
                      type: array
                      items:
                        type: object
                        properties:
                          title:
                            type: string
                          status:
                            type: string
                          result:
                            type:
                            - object
                            - 'null'
                            properties:
                              type:
                                type: string
                              url:
                                type: string
                              code:
                                type: string
                              title:
                                type: string
                              detail:
                                type: string
                    links:
                      type: object
                      properties:
                        link:
                          type: string
                        self:
                          type: string
                        source:
                          type: string
                  x-readme-ref-name: job
                - type: object
                  properties:
                    type:
                      type: string
                    id:
                      type: string
                    createdDate:
                      description: date and time in ISO format of when the job request was created
                      type: string
                      format: date-time
                    updatedDate:
                      description: date and time in ISO format of when the job request was updated
                      type: string
                      format: date-time
                    jobType:
                      type: string
                    sourceId:
                      type: string
                    steps:
                      type: array
                      items:
                        type: object
                        properties:
                          title:
                            type: string
                          status:
                            type: string
                          result:
                            type:
                            - object
                            - 'null'
                            properties:
                              type:
                                type: string
                              url:
                                type: string
                    links:
                      type: object
                      properties:
                        link:
                          type: string
                        self:
                          type: string
                        source:
                          type: string
                  x-readme-ref-name: StatementJobs
                - type: object
                  properties:
                    type:
                      type: string
                    id:
                      type: string
                    partnerId:
                      type: string
                    applicationId:
                      type: string
                    created:
                      type: string
                    updated:
                      type: string
                    status:
                      type: string
                    jobType:
                      type: string
                    steps:
                      type: array
                      items:
                        type: object
                        properties:
                          title:
                            type: string
                          status:
                            type: string
                          result:
                            type: object
                            properties:
                              type:
                                type: string
                              url:
                                type: string
                    links:
                      type: object
                      properties:
                        self:
                          type: string
                        source:
                          type: string
                  x-readme-ref-name: ReportsJob
