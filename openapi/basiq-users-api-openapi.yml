openapi: 3.2.0
info:
  title: Connect Users API
  description: All included utility endpoints for Basiq partners
  version: 3.0.0
  termsOfService: https://docs.basiq.io/en/collections/440849-privacy-terms-and-common-questions
  license:
    name: Commercial
    url: https://basiq.io
servers:
- url: https://au-api.basiq.io
security:
- api_key: []
- services_token: []
tags:
- name: Users
paths:
  /users:
    post:
      tags:
      - Users
      summary: Create a user
      description: Creates a new Basiq user object
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: The end-users email address. Mandatory if mobile is not supplied.
                  example: gavin@hooli.com
                mobile:
                  type: string
                  description: The end-users mobile number, supplied in international format. +[country-code][mobileno]. Mandatory if email is not supplied.
                  example: '+61410888999'
                firstName:
                  type: string
                  description: The end-users first name as an optional additional parameter.
                  example: Gavin
                middleName:
                  type: string
                  description: The end-users middle name as an optional additional parameter.
                  example: middle name
                lastName:
                  type: string
                  description: The end-users last name as an optional additional parameter.
                  example: Belson
                businessName:
                  type: string
                  description: The official name of the business.
                  example: Manly Accounting PTY LTD
                businessIdNo:
                  type: string
                  description: This number is used to identify a business when they’re dealing with the government, other businesses, and the public.
                  example: 16 7645 892
                businessIdNoType:
                  type: string
                  description: Type of business ID could be ABN Or ACN.
                  enum:
                  - ABN
                  - ACN
                  example: ABN
                businessAddress:
                  type: object
                  properties:
                    addressLine1:
                      type: string
                      example: 21 Sydney Rd
                      description: The first line of the business address.
                    addressLine2:
                      type: string
                      example: ''
                      description: Additional information about the business address (optional).
                    suburb:
                      type: string
                      example: Manly
                      description: The suburb or locality where the business is located.
                    state:
                      type: string
                      example: NSW
                      description: The state or territory where the business is located.
                    postcode:
                      type: string
                      example: '2095'
                      description: The postal code of the business location.
                    countryCode:
                      type: string
                      example: AUS
                      description: The country code of the business location.
                verificationStatus:
                  type: boolean
                  description: Indicates if the business information provided is verified against the Australian Business Register.
                verificationDate:
                  type: string
                  example: 12/01/2024
                  description: when the verification was done.
              x-readme-ref-name: createUser
            examples:
              user:
                summary: For All Users
                value:
                  email: gavin@hooli.com
                  mobile: '+61410888666'
                  firstName: Gavin
                  middleName: ''
                  lastName: Belson
              Bcc:
                summary: For Business Users
                value:
                  email: gavin@hooli.com
                  mobile: '+61410888999'
                  firstName: Gavin
                  middleName: middle name
                  lastName: Belson
                  businessName: Manly Accounting PTY LTD
                  businessIdNo: 16 7645 892
                  businessIdNoType: ABN
                  businessAddress:
                    addressLine1: 21 Sydney Rd
                    addressLine2: ''
                    suburb: Manly
                    state: NSW
                    postcode: '2095'
                    countryCode: AUS
                  verificationStatus: true
                  verificationDate: 12/01/2024
        required: true
      responses:
        '201':
          description: Returns the user object if the creation succeeded.
          content:
            application/json:
              schema:
                title: UserPostResponse
                required:
                - id
                - links
                - mobile
                - type
                type: object
                properties:
                  type:
                    type: string
                    description: Type of the response, always "user".
                    example: user
                  id:
                    type: string
                    description: A string that uniquely identifies the user.
                    example: e1956419
                  email:
                    type: string
                    description: The end-users email address.
                    format: email
                    example: gavin@hooli.com
                  mobile:
                    type: string
                    description: The end-users mobile number.
                    example: 61410888999
                  firstName:
                    type: string
                    description: The end-users first name as an optional additional parameter.
                    example: Gavin
                  middleName:
                    type: string
                    description: The end-users middle name as an optional additional parameter.
                    example: middle name
                  lastName:
                    type: string
                    description: The end-users last name as an optional additional parameter.
                    example: Belson
                  businessName:
                    type: string
                    description: The official name of the business.
                    example: Manly Accounting PTY LTD
                  businessIdNo:
                    type: string
                    description: This number is used to identify a business when they’re dealing with the government, other businesses, and the public.
                    example: 16 7645 892
                  businessIdNoType:
                    type: string
                    description: Type of business ID could be ABN Or ACN.
                    enum:
                    - ABN
                    - ACN
                    example: ABN
                  businessAddress:
                    type: object
                    properties:
                      addressLine1:
                        type: string
                        example: 21 Sydney Rd
                        description: The first line of the business address.
                      addressLine2:
                        type: string
                        example: ''
                        description: Additional information about the business address (optional).
                      suburb:
                        type: string
                        example: Manly
                        description: The suburb or locality where the business is located.
                      state:
                        type: string
                        example: NSW
                        description: The state or territory where the business is located.
                      postcode:
                        type: string
                        example: '2095'
                        description: The postal code of the business location.
                      countryCode:
                        type: string
                        example: AUS
                        description: The country code of the business location.
                  verificationStatus:
                    type: boolean
                    description: Indicates if the business information provided is verified against the Australian Business Register.
                  verificationDate:
                    type: string
                    example: 12/01/2024
                    description: when the verification was done.
                  links:
                    title: ResourceLink
                    required:
                    - self
                    type: object
                    properties:
                      self:
                        type: string
                        description: URL of the resource.
                        example: https://au-api.basiq.io/link/a3dgf4567a89
                    description: Link object containing a link to the resource, self reference.
                    x-readme-ref-name: ResourceLink
                description: User object with details if the creation succeeded.
                x-readme-ref-name: UserPostResponse
        '400':
          description: Returns error that server cannot or will not process the request due to something that is perceived to be a client error.
          content:
            application/json:
              schema:
                required:
                - correlationId
                - data
                - type
                type: object
                properties:
                  type:
                    type: string
                    description: Always "list".
                    example: list
                  correlationId:
                    type: string
                    description: Unique identifier for this particular occurrence of the problem.
                    example: ac5ah5i
                  data:
                    type: array
                    description: Error data.
                    items:
                      required:
                      - code
                      - type
                      type: object
                      properties:
                        type:
                          type: string
                          description: Type of the response, always "error"
                          example: error
                        title:
                          type: string
                          description: Title of the error
                          example: Parameter not valid.
                        code:
                          type: string
                          description: Application-specific error code, expressed as a string value.
                          example: parameter-not-valid
                          enum:
                          - parameter-not-supplied
                          - parameter-not-valid
                          - unsupported-accept
                          - invalid-content
                          - institution-not-supported
                          - invalid-credentials
                        detail:
                          type: string
                          description: Human-readable explanation specific to this occurrence of the problem.
                          example: ID value is not valid.
                        source:
                          title: Source
                          type: object
                          properties:
                            parameter:
                              type: string
                              description: String indicating which URI query parameter caused the error.
                              example: id
                          description: An object containing references to the source of the error.
                          x-readme-ref-name: Source
                x-readme-ref-name: BadRequestError
        '401':
          description: Error status response code indicates that the request has not been applied because it lacks valid authentication credentials for the target resource.
