                type: object
                properties:
                  correlationId:
                    type: string
                    description: Unique identifier for this particular occurrence of the problem.
                    example: ac5ah5i
                  data:
                    type: array
                    description: Error data.
                    items:
                      required:
                      - code
                      - type
                      type: object
                      properties:
                        code:
                          type: string
                          description: Application-specific error code, expressed as a string value.
                          example: internal-server-error
                          enum:
                          - internal-server-error
                        detail:
                          type: string
                          description: Human-readable explanation specific to this occurrence of the problem.
                          example: Internal Server error. Contact support.
                        title:
                          type: string
                          description: Title of the error
                          example: Internal Server error.
                        type:
                          type: string
                          description: Type of the response, always "error"
                          example: error
                  type:
                    type: string
                    description: Always "list".
                    example: list
                x-readme-ref-name: InternalServerError
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                required:
                - correlationId
                - data
                - type
                type: object
                properties:
                  type:
                    type: string
                    description: Always "list".
                    example: list
                  correlationId:
                    type: string
                    description: Unique identifier for this particular occurrence of the problem.
                    example: ac5ah5i
                  data:
                    type: array
                    description: Error data.
                    items:
                      required:
                      - code
                      - type
                      type: object
                      properties:
                        type:
                          type: string
                          description: Type of the response, always "error"
                          example: error
                        title:
                          type: string
                          description: Title of the error
                          example: Service Unavailable
                        code:
                          type: object
                          description: Application-specific error code, expressed as a string value.
                          example: service-unavailable
                        detail:
                          type: string
                          description: Human-readable explanation specific to this occurrence of the problem.
                          example: Service Unavailable. Try again later.
                x-readme-ref-name: StatusServiceUnavailableError
