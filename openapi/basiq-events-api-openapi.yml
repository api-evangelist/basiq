  /events/{id}:
    get:
      tags:
      - Events
      summary: Retrieve an event
      description: Returns a single event type based on the parameter input.
      operationId: getTypeById
      parameters:
      - name: id
        required: true
        schema:
          type: string
        in: path
        example: a0fa1d01e0c9a1032e29ac74ade5f786e880ae04f4e3788144c6d13b53e5d29b
