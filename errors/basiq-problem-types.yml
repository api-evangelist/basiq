format: basiq-json-error-list
rfc9457: false
envelope:
  content_type: application/json
  shape: '{"type":"list","correlationId":..., "data":[{"type":"error","code","title","detail","source":{"pointer","parameter"}}]}'
  fields:
    correlationId: a unique identifier for this particular occurrence of the problem.
    code: an application-specific error code, expressed as a string value.
    title: a short, human-readable summary of the problem.
    detail: a human-readable explanation specific to this occurrence of the problem.
    source: an object containing references to the source of the error (pointer, parameter).
  multiple_errors: true
problems:
- status: 400
  title: Invalid request content
  type: null
  codes:
  - invalid-content
  - parameter-not-supplied
  - parameter-not-valid
  - path-parameter-not-valid
  - resource-not-found
  - unsupported-accept
  description: Documented Basiq error codes for this status.
  remediation: 'Fix the request: supply/validate the parameter named in source.parameter or source.pointer.'
- status: 401
  title: access-denied
  type: null
  codes:
  - Invalid authorization token
  - access-denied
  - invalid-authorization-token
  - unauthorised-access
  description: Documented Basiq error codes for this status.
  remediation: Generate a new token via POST /token (tokens expire every 60 minutes) and retry.
- status: 403
  title: access-denied
  type: null
  codes:
  - Forbidden access
  - access-denied
  - forbidden-access
  - request-not-valid
  description: Documented Basiq error codes for this status.
  remediation: Check the token has not expired and the account/API key is enabled; may also signal platform limits being exceeded.
- status: 404
  title: We have encountered an error
  type: null
  codes:
