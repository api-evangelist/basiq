  remediation: Send a supported Content-Type.
- status: 429
  title: Too Many Requests
  type: null
  codes:
  - too-many-requests
  description: Documented Basiq error codes for this status.
  remediation: Back off; you have exceeded a platform limit (https://api.basiq.io/docs/api-rate-limiting).
- status: 500
  title: We have encountered an error
  type: null
  codes:
  - Internal server error
  - parameter-not-valid
  description: Documented Basiq error codes for this status.
