specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
name: Basiq rate limits
provider: Basiq
providerId: basiq
generated: '2026-10-21'
method: searched
source: https://api.basiq.io/docs/api-rate-limiting
limit_count: 5
description: >-
  Basiq publishes explicit limits for specific components plus unpublished "generic limits that apply platform
  wide". Exceeding limits may produce 429 or 403 responses; no rate-limit response headers (X-RateLimit-*,
  RateLimit-*, Retry-After) are documented or declared in the OpenAPI.
exhaustion:
  status_codes: [429, 403]
  text: may see error responses from the APIs, including 429 or 403 errors
  overage_text: Note that additional charges may apply if you exceed our limits.
headers: []
increase: To request an increased rate limit, please contact Basiq support
limits:
- name: Generate an auth token
  endpoint: POST /token
  operationId: postToken
  limit_text: 1,500 requests per 5 minute period. Auth tokens should be reused as much as possible and not recreated for each request.
  max: 1500
  window: 5 minutes
  scope: per-account
- name: Enrich (sandbox)
  endpoint: https://api.basiq.io/reference/enrich-1
  plan: sandbox
  limit_text: Sandbox users can run 100 requests per month.
  max: 100
  window: 1 month
  scope: per-account
- name: Create an affordability summary
  endpoint: POST /users/{userId}/affordability
  operationId: postAffordability
  limit_text: The lesser of the number of users created per day or 1,000 total per day (including affordability, income and expenses summaries).
  window: 1 day
  scope: per-account
- name: Create an income summary
  endpoint: POST /users/{userId}/income
  operationId: postIncome
  limit_text: As Above.
  note: Shares the affordability limit (lesser of users created per day or 1,000 total per day).
  window: 1 day
  scope: per-account
- name: Create an expense summary
  endpoint: POST /users/{userId}/expenses
  operationId: postExpenses
  limit_text: As Above.
  note: Shares the affordability limit (lesser of users created per day or 1,000 total per day).
  window: 1 day
  scope: per-account
- name: Create a report
  endpoint: POST /reports
  operationId: createreport
  limit_text: The lesser of the number of users created per day or 1,000 total per day.
  window: 1 day
  scope: per-account
note: The sandbox also caps connections at 500 ("There is a limit of 500 for sandbox connections.", https://api.basiq.io/reference/testing); recorded in sandbox/basiq-sandbox.yml.
