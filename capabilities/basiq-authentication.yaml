naftiko: 1.0.0-alpha2
info:
  label: Basiq API — Authentication
  description: 'Basiq API — Authentication. 1 operations. Lead operation: Create Token. Self-contained Naftiko capability
    covering one Basiq business surface.'
  tags:
  - Basiq
  - Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BASIQ_API_KEY: BASIQ_API_KEY
capability:
  consumes:
  - type: http
    namespace: basiq-authentication
    baseUri: https://au-api.basiq.io
    description: Basiq API — Authentication business capability. Self-contained, no shared references.
    resources:
    - name: token
      path: /token
      operations:
      - name: createtoken
        method: POST
        description: Create Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.BASIQ_API_KEY}}'
  exposes:
  - type: rest
    namespace: basiq-authentication-rest
    port: 8080
    description: REST adapter for Basiq API — Authentication. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/token
      name: token
      description: REST surface for token.
      operations:
      - method: POST
        name: createtoken
        description: Create Token
        call: basiq-authentication.createtoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: basiq-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Basiq API — Authentication. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: create-token
      description: Create Token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: basiq-authentication.createtoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
